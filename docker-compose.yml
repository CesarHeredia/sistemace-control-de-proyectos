version: '3.8'

services:
  sistema-notas:
    build: .
    container_name: sistema_notas_app
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # Montamos la carpeta actual para que los cambios en el código se reflejen sin reconstruir
      - .:/app
